<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toán Vui Tiểu Học — Học theo SGK Kết nối tri thức</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <button class="logo" id="btn-home" title="Về trang chủ">
    <img class="logo-img" src="nv/tho.png" alt="Thỏ Bông">
    <span class="logo-text">Toán Vui Tiểu Học</span>
  </button>
  <div class="tagline">Bám sát SGK <b>Kết nối tri thức với cuộc sống</b></div>
</header>

<main id="app"></main>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button class="modal-close" id="modal-close">✕</button>
    <h3 id="modal-title"></h3>
    <video id="modal-video" controls playsinline></video>
  </div>
</div>

<div id="confetti-layer"></div>

<footer class="footer">
  <img class="ft-nv" src="nv/tho.png" alt=""> Thỏ Bông ·
  <img class="ft-nv" src="nv/meo.png" alt=""> Mèo Múp ·
  <img class="ft-nv" src="nv/ong.png" alt=""> Ong Vàng — cùng bé chinh phục Toán tiểu học!
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
